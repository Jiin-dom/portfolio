<!DOCTYPE html><html><head><meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&display=swap" rel="stylesheet"/>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0c0e12;font-family:"Bricolage Grotesque",sans-serif}
.stage{position:relative;width:min(94vw,980px);height:min(58vw,540px)}
.letter{position:absolute;left:50%;top:50%;font-weight:800;color:#ece7df;line-height:1;letter-spacing:-0.06em;transform-origin:center center}
.label{position:fixed;left:24px;bottom:24px;color:#a8a29a;font-family:ui-monospace,monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
</style></head><body>
<div class="stage" id="stage"></div>
<p class="label">Letter Jeff — head e (right) · jaw J · dorsal a · legs n n · tail e (left)</p>
<script>
const POSES=[
  {"char":"J","x":0.28,"y":-0.08,"rot":16,"scale":2.05},
  {"char":"e","x":1.2,"y":0.16,"rot":-12,"scale":2.95},
  {"char":"a","x":-0.12,"y":0.98,"rot":-28,"scale":1.8},
  {"char":"n","x":0.22,"y":-0.92,"rot":2,"scale":1.35},
  {"char":"n","x":-0.58,"y":-0.86,"rot":-8,"scale":1.3},
  {"char":"e","x":-1.5,"y":0.02,"rot":96,"scale":1.55}
];
const stage=document.getElementById("stage");
function place(){
  stage.innerHTML="";
  const unit=Math.min(stage.clientWidth,980)*0.145;
  const base=unit*0.92;
  [...POSES].reverse().forEach(p=>{
    const el=document.createElement("span");
    el.className="letter";
    el.textContent=p.char;
    el.style.fontSize=base+"px";
    el.style.transform=`translate(-50%,-50%) translate(${p.x*unit}px, ${-p.y*unit}px) rotate(${p.rot}deg) scale(${p.scale})`;
    stage.appendChild(el);
  });
}
place(); addEventListener("resize", place);
</script></body></html>
